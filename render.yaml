services:
  - type: web
    name: saathi-backend-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: saathi-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        value: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - key: FRONTEND_API_KEY
        value: saathi_fe_key_2026_prod_demo_live
      - key: IVR_API_KEY
        value: saathi_ivr_key_2026_webhook_secure
      - key: ADMIN_API_KEY
        value: saathi_adm_key_2026_supervisor_tool

databases:
  - name: saathi-db
    databaseName: saathi_db
    plan: free
